{% extends "base.html" %}

{% block guest_content %}
<div class="min-h-[80vh] flex items-center justify-center bg-gray-50">
    <div class="max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-blue-600 rounded flex items-center justify-center text-white text-2xl font-black mx-auto mb-4 shadow-sm">A</div>
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">AMR Shield Access</h1>
            <p class="text-gray-500 text-sm mt-1">Surveillance and Clinical Data Platform</p>
        </div>

        <div class="bg-white border border-gray-200 rounded-lg p-8 shadow-sm">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Username</label>
                    <input type="text" name="username" required class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 focus:bg-white outline-none text-sm transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Security Key</label>
                    <input type="password" name="password" required class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 focus:bg-white outline-none text-sm transition-all">
                </div>
                <button type="submit" class="w-full btn-primary py-3">Authenticate</button>
            </form>
        </div>
        
        <div class="mt-8 text-center">
            <p class="text-[10px] text-gray-400 font-medium uppercase tracking-[0.2em] leading-relaxed">
                Unauthorized access is strictly prohibited.<br>All operations are monitored.
            </p>
        </div>
    </div>
</div>
{% endblock %}
