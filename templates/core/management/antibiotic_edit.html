{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center gap-4">
        <a href="{% url 'antibiotic_list' %}" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Edit Medication: {{ antibiotic.name }}</h1>
    </div>

    <div class="data-card p-8">
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Medication Name</label>
                <input type="text" name="name" value="{{ antibiotic.name }}" required class="w-full p-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Clinical Group</label>
                <input type="text" name="group" value="{{ antibiotic.group }}" required class="w-full p-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Category (A/B/C)</label>
                <input type="text" name="category" value="{{ antibiotic.category }}" required class="w-full p-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none text-sm">
            </div>
            <div class="pt-4 flex justify-end gap-3">
                <a href="{% url 'antibiotic_list' %}" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
