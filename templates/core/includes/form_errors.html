{% if form.errors %}
<div class="mb-6 px-4 py-3 rounded border bg-red-50 border-red-200 text-red-700 text-xs space-y-1">
    {% for error in form.non_field_errors %}
    <div>{{ error }}</div>
    {% endfor %}
    {% for field in form %}
        {% for error in field.errors %}
        <div><span class="font-bold uppercase tracking-tighter">{{ field.label }}:</span> {{ error }}</div>
        {% endfor %}
    {% endfor %}
</div>
{% endif %}
